[project]
name = "halo"
version = "0.1.0"
description = "Halo: an AI agent that watches creator videos and runs influencer campaigns for Uzbek brands"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
