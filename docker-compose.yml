x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    HALO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/halo
    HALO_REDIS_URL: redis://redis:6379/0
    HALO_MEDIA_DIR: /data/media
  volumes:
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: arq halo.worker.WorkerSettings
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Needs HALO_TELEGRAM_BOT_TOKEN. Start with: docker compose --profile bot up
  bot:
    <<: *backend
    command: python -m halo.bot.main
    profiles: ["bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  media:
